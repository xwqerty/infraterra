<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Infraterra Display</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    
    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .ad-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    
    .ad-image, .ad-video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    
    .config-screen {
      max-width: 500px;
      padding: 20px;
      background-color: #333;
      border-radius: 10px;
    }
    
    .config-screen h2 {
      margin-top: 0;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
    }
    
    .form-group textarea {
      width: 100%;
      height: 100px;
      padding: 8px;
      box-sizing: border-box;
    }
    
    .form-group input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    
    button {
      padding: 10px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    button:hover {
      background-color: #45a049;
    }
    
    .status-indicator {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background-color: #f00;
    }
    
    .status-indicator.online {
      background-color: #4CAF50;
    }
    
    .status-indicator.offline {
      background-color: #f00;
    }
    
    .error-message {
      background-color: rgba(255, 0, 0, 0.7);
      color: white;
      padding: 20px;
      border-radius: 5px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Ad display container -->
    <div id="adContainer" class="ad-container" style="display: none;">
      <div id="statusIndicator" class="status-indicator offline"></div>
    </div>
    
    <!-- Configuration screen -->
    <div id="configScreen" class="config-screen" style="display: none;">
      <h2>Screen Configuration</h2>
      <div class="form-group">
        <label for="screenId">Screen ID:</label>
        <input type="text" id="screenId" placeholder="Enter the screen ID">
      </div>
      <div class="form-group">
        <label for="certificatePem">Certificate (PEM):</label>
        <textarea id="certificatePem" placeholder="Paste certificate PEM content"></textarea>
      </div>
      <div class="form-group">
        <label for="privateKey">Private Key:</label>
        <textarea id="privateKey" placeholder="Paste private key content"></textarea>
      </div>
      <div class="form-group">
        <label for="endpoint">IoT Endpoint:</label>
        <input type="text" id="endpoint" placeholder="Enter IoT endpoint URL">
      </div>
      <button id="configureButton">Configure Device</button>
    </div>
    
    <!-- Loading message -->
    <div id="loadingMessage" class="loading-message">
      <h2>Initializing...</h2>
    </div>
    
    <!-- Error message -->
    <div id="errorMessage" class="error-message" style="display: none;">
      <h3>Error</h3>
      <p id="errorText"></p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
